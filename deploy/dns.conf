# DNS voor de server: Cloudflare en Quad9 in plaats van de DNS van het schoolnetwerk.
# Die gaf verouderde adressen voor Docker Hub, waardoor bouwen mislukte (zie README).
# Staat op de server in /etc/systemd/network/10-netplan-ens3.network.d/dns.conf
[Network]
DNS=1.1.1.1
DNS=9.9.9.9

[DHCPv4]
UseDNS=false

[DHCPv6]
UseDNS=false

[IPv6AcceptRA]
UseDNS=false
