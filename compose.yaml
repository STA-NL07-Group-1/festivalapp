# Lokale PostgreSQL voor ontwikkeling:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: festivalapp
      POSTGRES_PASSWORD: festivalapp
      POSTGRES_DB: festivalapp
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U festivalapp']
      interval: 5s
      retries: 10

volumes:
  pgdata:
