name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test en build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: festivalapp
          POSTGRES_PASSWORD: festivalapp
          POSTGRES_DB: festivalapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U festivalapp"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://festivalapp:festivalapp@localhost:5432/festivalapp_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Database-constraints controleren
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f backend/db/constraints-test.sql
