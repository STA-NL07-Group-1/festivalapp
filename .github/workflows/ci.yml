name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: festivalapp
          POSTGRES_PASSWORD: festivalapp
          POSTGRES_DB: festivalapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U festivalapp"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://festivalapp:festivalapp@localhost:5432/festivalapp_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Database-constraints controleren
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f backend/db/constraints-test.sql