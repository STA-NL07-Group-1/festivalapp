name: DCO

# Controleert of elke commit in een pull request "Signed-off-by" heeft
# (Developer Certificate of Origin, https://developercertificate.org).
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Signed-off-by controleren
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$c")
            # Bots zoals Dependabot ondertekenen met een ander adres; die slaan we over
            case "$email" in *"[bot]@users.noreply.github.com") continue ;; esac
            if ! git log -1 --format='%B' "$c" | grep -i '^Signed-off-by:' | grep -qiF "<$email>"; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") mist 'Signed-off-by' met $email. Zie CONTRIBUTING.md (DCO)."
              missing=1
            fi
          done
          exit $missing