name: Scorecard

# OpenSSF Scorecard: geeft de repo een security-score van 0 tot 10.
# Resultaten staan onder Security -> Code scanning en op scorecard.dev.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'   # elke maandag 07:30 (NL-tijd)
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write   # resultaten naar het Security-tabblad
      id-token: write          # nodig om de score publiek te publiceren (badge)
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif