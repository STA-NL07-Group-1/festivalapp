openapi: 3.1.0
info:
  title: Festivalapp API
  version: 0.1.0-concept
  summary: Concept van de REST-API voor de Festivalapp (PWA).
  description: |
    **Status: concept (sprint 1).** Dit is een startpunt voor de API-afspraken.
    Network & Cloud (backend) en Software (app) passen dit samen aan; Cyber Security reviewt.

    ## Realtime (WebSocket)
    Naast deze REST-API is er een WebSocket-verbinding op `wss://<host>/ws`
    (authenticatie met hetzelfde access token als eerste bericht). Events:

    | Event | Richting | Inhoud |
    | --- | --- | --- |
    | `location.update` | server → client | `FriendLocation` van een vriend |
    | `chat.message` | server → client | `Message` in een chat |
    | `announcement.new` | server → client | `Announcement` (noodbericht of update) |
    | `timetable.changed` | server → client | `{ slotId }` van een gewijzigd optreden |

    ## Algemene security-afspraken
    - Alle verkeer via HTTPS/WSS; geen HTTP.
    - Authenticatie met een kortlevend access token (JWT, 15 min) en een refresh token (httpOnly cookie).
    - Elke endpoint controleert of de gebruiker de gevraagde gegevens mag zien (bijv. alleen locaties van geaccepteerde vrienden).
    - Rate limiting op login, vriendcodes en SOS; bij overschrijding `429 Too Many Requests`.
    - Foutmeldingen bevatten geen interne details (geen stacktraces of SQL).
  license:
    name: MIT
    url: https://github.com/STA-NL07-Group-1/festivalapp/blob/main/LICENSE

servers:
  - url: http://localhost:3000/api/v1
    description: Lokaal
  - url: https://staging.example.org/api/v1
    description: Staging (adres volgt)

tags:
  - name: Auth
  - name: Vrienden
  - name: Locatie
  - name: Pins
  - name: Timetable
  - name: Chat
  - name: Meldingen
  - name: Noodberichten
  - name: SOS

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Account aanmaken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password:
                  type: string
                  minLength: 12
                  description: Wordt opgeslagen als Argon2id-hash, nooit leesbaar.
                displayName: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '201':
          description: Account aangemaakt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: E-mailadres is al in gebruik
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Inloggen
      description: Na 5 mislukte pogingen per 15 minuten volgt `429`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Ingelogd; refresh token wordt als httpOnly cookie gezet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Nieuw access token ophalen met het refresh token (cookie)
      security: []
      responses:
        '200':
          description: Nieuw access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Uitloggen en refresh token intrekken
      responses:
        '204': { description: Uitgelogd }

  /me:
    get:
      tags: [Auth]
      summary: Eigen profiel ophalen
      responses:
        '200':
          description: Profiel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      summary: Account en alle gegevens verwijderen (AVG)
      responses:
        '204': { description: Account verwijderd }

  /friends/codes:
    post:
      tags: [Vrienden]
      summary: Tijdelijke vriendcode (en QR) maken
      description: |
        De code is willekeurig (cryptografisch veilig), 8 tekens, verloopt na 10 minuten
        en is één keer bruikbaar. Maximaal 10 codes per uur per gebruiker.
      responses:
        '201':
          description: Code aangemaakt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendCode' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /friends/redeem:
    post:
      tags: [Vrienden]
      summary: Vriendcode inwisselen (getypt of gescand)
      description: Ongeldige of verlopen codes geven allemaal dezelfde foutmelding, zodat codes niet te raden zijn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$' }
      responses:
        '201':
          description: Vriendschap aangemaakt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Friend' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /friends:
    get:
      tags: [Vrienden]
      summary: Lijst van vrienden
      responses:
        '200':
          description: Vrienden
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Friend' }

  /friends/{friendId}:
    parameters:
      - $ref: '#/components/parameters/FriendId'
    delete:
      tags: [Vrienden]
      summary: Vriend verwijderen
      description: Daarna ziet geen van beiden nog de locatie of timetable van de ander.
      responses:
        '204': { description: Verwijderd }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/location:
    put:
      tags: [Locatie]
      summary: Eigen locatie bijwerken
      description: Alleen opgeslagen als locatiedelen aan staat. Locaties worden na 24 uur verwijderd.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '204': { description: Bijgewerkt }
        '400': { $ref: '#/components/responses/BadRequest' }

  /me/sharing:
    get:
      tags: [Locatie]
      summary: Instellingen voor locatiedelen ophalen
      responses:
        '200':
          description: Instellingen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharingSettings' }
    patch:
      tags: [Locatie]
      summary: Locatiedelen aan/uit of per vriend aanpassen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharingSettings' }
      responses:
        '200':
          description: Bijgewerkt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharingSettings' }

  /friends/locations:
    get:
      tags: [Locatie]
      summary: Laatst bekende locaties van vrienden
      description: Alleen vrienden die hun locatie met jou delen.
      responses:
        '200':
          description: Locaties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FriendLocation' }

  /pins:
    get:
      tags: [Pins]
      summary: Eigen pins en pins die vrienden met je delen
      responses:
        '200':
          description: Pins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pin' }
    post:
      tags: [Pins]
      summary: Pin droppen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinInput' }
      responses:
        '201':
          description: Pin aangemaakt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pin' }

  /pins/{pinId}:
    parameters:
      - name: pinId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Pins]
      summary: Eigen pin verwijderen
      responses:
        '204': { description: Verwijderd }
        '404': { $ref: '#/components/responses/NotFound' }

  /timetable:
    get:
      tags: [Timetable]
      summary: Volledige timetable (podia en optredens)
      security: []
      responses:
        '200':
          description: Timetable
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }

  /me/timetable:
    get:
      tags: [Timetable]
      summary: Eigen persoonlijke timetable
      responses:
        '200':
          description: Gekozen optredens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }

  /me/timetable/{slotId}:
    parameters:
      - $ref: '#/components/parameters/SlotId'
    put:
      tags: [Timetable]
      summary: Optreden toevoegen aan eigen timetable
      responses:
        '204': { description: Toegevoegd }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Timetable]
      summary: Optreden verwijderen uit eigen timetable
      responses:
        '204': { description: Verwijderd }

  /friends/{friendId}/timetable:
    parameters:
      - $ref: '#/components/parameters/FriendId'
    get:
      tags: [Timetable]
      summary: Timetable van een vriend
      responses:
        '200':
          description: Optredens van de vriend
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Slot' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chats/{friendId}/messages:
    parameters:
      - $ref: '#/components/parameters/FriendId'
    get:
      tags: [Chat]
      summary: Berichten met een vriend (nieuwste eerst)
      parameters:
        - name: before
          in: query
          description: Berichten van vóór dit tijdstip (paginering)
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Berichten
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
    post:
      tags: [Chat]
      summary: Bericht sturen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '201':
          description: Verstuurd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /push/subscriptions:
    post:
      tags: [Meldingen]
      summary: Web Push-abonnement van dit apparaat registreren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        '201': { description: Geregistreerd }
    delete:
      tags: [Meldingen]
      summary: Abonnement van dit apparaat verwijderen
      responses:
        '204': { description: Verwijderd }

  /announcements:
    get:
      tags: [Noodberichten]
      summary: Actuele berichten van de organisatie (inclusief noodberichten)
      security: []
      responses:
        '200':
          description: Berichten
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Announcement' }

  /admin/announcements:
    post:
      tags: [Noodberichten]
      summary: Bericht of noodbericht versturen (beheerportal)
      description: |
        Alleen rol `organisator`. Noodberichten worden server-side ondertekend,
        zodat de app kan controleren dat het bericht echt van de organisatie komt.
        Elke actie wordt gelogd (wie, wat, wanneer).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, body]
              properties:
                type: { type: string, enum: [info, update, nood] }
                title: { type: string, maxLength: 80 }
                body: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Verstuurd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sos:
    post:
      tags: [SOS]
      summary: SOS-melding versturen
      description: |
        Stuurt locatie en type hulp naar EHBO/security. Maximaal 3 meldingen per 10 minuten
        per gebruiker tegen misbruik; een echte noodsituatie wordt nooit geblokkeerd zonder
        de gebruiker naar 112 te verwijzen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, location]
              properties:
                type: { type: string, enum: [medisch, veiligheid, anders] }
                note: { type: string, maxLength: 200 }
                location: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Melding ontvangen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SosReport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/sos:
    get:
      tags: [SOS]
      summary: Openstaande SOS-meldingen (beheerportal)
      description: Alleen rollen `ehbo` en `security`.
      responses:
        '200':
          description: Meldingen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SosReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FriendId:
      name: friendId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SlotId:
      name: slotId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Ongeldige invoer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Niet ingelogd of token ongeldig
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Geen rechten voor deze actie
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Niet gevonden (of geen toegang)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Te veel verzoeken, probeer later opnieuw
      headers:
        Retry-After:
          schema: { type: integer }
          description: Aantal seconden wachten
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [invalid_input] }
        message: { type: string, examples: [Ongeldige invoer] }

    AuthTokens:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconden, examples: [900] }

    User:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [bezoeker, organisator, ehbo, security]
          default: bezoeker

    Friend:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        since: { type: string, format: date-time }

    FriendCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string, examples: [K7P3XQ9M] }
        expiresAt: { type: string, format: date-time }
        qrPayload:
          type: string
          description: Inhoud van de QR-code (bevat alleen de code, geen persoonsgegevens)

    LocationInput:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, description: Nauwkeurigheid in meters }

    FriendLocation:
      type: object
      required: [friendId, lat, lng, updatedAt]
      properties:
        friendId: { type: string, format: uuid }
        lat: { type: number }
        lng: { type: number }
        accuracy: { type: number }
        updatedAt:
          type: string
          format: date-time
          description: Voor "laatst gezien om ..." in de app

    SharingSettings:
      type: object
      properties:
        enabled: { type: boolean, description: Locatiedelen aan of uit }
        hiddenFrom:
          type: array
          description: Vrienden die je locatie niet mogen zien
          items: { type: string, format: uuid }

    PinInput:
      type: object
      required: [lat, lng, label]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        label: { type: string, maxLength: 40, examples: [Ontmoetingsplek] }
        sharedWithFriends: { type: boolean, default: true }

    Pin:
      allOf:
        - $ref: '#/components/schemas/PinInput'
        - type: object
          required: [id, ownerId]
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    Slot:
      type: object
      required: [id, act, stage, start, end]
      properties:
        id: { type: string, format: uuid }
        act: { type: string, examples: [Artiestnaam] }
        stage: { type: string, examples: [Mainstage] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status:
          type: string
          enum: [gepland, verplaatst, geannuleerd]
          default: gepland

    Message:
      type: object
      required: [id, senderId, text, sentAt]
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        text: { type: string }
        sentAt: { type: string, format: date-time }

    Announcement:
      type: object
      required: [id, type, title, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [info, update, nood] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        signature:
          type: string
          description: Handtekening van de organisatie (alleen bij type nood), door de app te controleren

    SosReport:
      type: object
      required: [id, type, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [medisch, veiligheid, anders] }
        note: { type: string }
        location: { $ref: '#/components/schemas/LocationInput' }
        status:
          type: string
          enum: [ontvangen, onderweg, afgehandeld]
        createdAt: { type: string, format: date-time }