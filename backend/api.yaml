openapi: 3.1.0
info:
  title: Festivalapp API
  version: 0.1.0
  summary: REST- en WebSocket-API voor de Festivalapp en het beheerportal.
  description: |
    API tussen de PWA (`app/`), het beheerportal (`portal/`), IoT-sensoren en de
    backend (`backend/`).

    **Authenticatie.** Inloggen levert een kortlevend access-token (JWT, 15 min) en een
    refresh-token (7 dagen, alleen als hash opgeslagen). Stuur het access-token mee als
    `Authorization: Bearer <token>`.

    **Festivals.** Er kunnen meerdere festivals naast elkaar bestaan. Stuur bij elk verzoek
    de header `X-Festival-Id` mee met het festival waar het over gaat (zie `GET /festivals`).
    Zonder header kiest de server het festival dat nu bezig is, anders het eerstvolgende.
    Bezoekers hebben per festival een ticket nodig en verliezen de toegang als het festival
    is afgelopen. Vrienden en chats horen bij het account en blijven altijd bereikbaar.

    **Rollen.** Een rol geldt per festival: `beheerder`, `organisatie`, `ehbo` of `beveiliging`.
    Wie alleen een ticket heeft is `bezoeker`. `x-roles` bij een operatie geeft aan welke rollen
    hem mogen gebruiken; zonder `x-roles` mag elke ingelogde gebruiker het. Daarnaast zijn er twee
    rollen over alle festivals heen (`x-platform-roles`): `eigenaar` en `sudo`. Die mogen bij elk
    festival, met de rechten van een beheerder. Alleen `sudo` wijst eigenaren en beheerders aan.

    **Realtime.** Na het inloggen opent de app een WebSocket op
    `/ws?token=<access-token>&festival=<festival-id>`. Je krijgt alleen berichten van dat festival.
    De server stuurt berichten als JSON: `{ "type": "...", "data": { ... } }`. Types:
    `friend.location`, `friend.location.removed`, `friend.added`, `friend.removed`, `pin.created`,
    `chat.message`, `timetable.update`, `announcement`, `crowd.update`,
    `map_point.update`, `map_point.removed`, `sos.update` (alleen personeel van het festival). De client stuurt alleen `ping`; alle wijzigingen
    lopen via REST zodat autorisatie op één plek zit.

    **Fouten** hebben altijd de vorm van `Error` en lekken nooit stacktraces of SQL.

    **`x-table`** bij een schema koppelt het aan een databasetabel (camelCase → snake_case).
    Properties in `x-computed` hebben geen eigen kolom.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: STA-NL07 Groep 1
servers:
  - url: http://localhost:3000
    description: Lokale backend

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registreren, inloggen en sessies
  - name: account
    description: Eigen profiel en instellingen
  - name: friends
    description: Vrienden, vriendcodes en locaties
  - name: map
    description: Pins op de kaart
  - name: chat
    description: Berichten tussen vrienden
  - name: timetable
    description: Programma, persoonlijke timetable en aanmelden voor shows
  - name: crowd
    description: Live drukte (IoT)
  - name: notifications
    description: Pushmeldingen, mededelingen en SOS
  - name: chatbot
    description: AI-assistent (Open Learning)
  - name: festivals
    description: Festivals, tickets, het team per festival en de eigenaren
  - name: admin
    description: Beheerportal (alleen personeel van het festival)
  - name: iot
    description: Endpoints voor sensoren
  - name: system
    description: Status van de dienst

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Controleer of de API draait
      security: []
      responses:
        '200':
          description: De API draait
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                required: [status]
              example: { status: ok }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- auth
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Maak een account aan met een festivalticket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account aangemaakt en ingelogd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9.mock.signature
                refreshToken: mock-refresh-token
                expiresIn: 900
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Ticket al gekoppeld of e-mailadres al in gebruik. Bewust één melding voor beide, zodat niet te achterhalen is welk van de twee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in met e-mail en wachtwoord
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Ingelogd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9.mock.signature
                refreshToken: mock-refresh-token
                expiresIn: 900
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: E-mail of wachtwoord onjuist (altijd dezelfde melding)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Vraag een nieuw access-token aan
      description: Het oude refresh-token wordt direct ingetrokken (rotatie). Wordt een al gebruikt token opnieuw aangeboden, dan worden alle sessies van de gebruiker ingetrokken.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Nieuwe tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9.mock.signature
                refreshToken: mock-refresh-token-2
                expiresIn: 900
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log uit en trek de huidige sessie in
      responses:
        '204': { description: Uitgelogd }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- account
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: Haal je eigen profiel en instellingen op
      responses:
        '200':
          description: Profiel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                id: 7d1c2c5e-6f4b-4c39-9c1e-0a5b8f0b1a11
                email: anna@example.org
                displayName: Anna
                role: bezoeker
                platformRole: null
                festivalId: 00000000-0000-4000-8000-000000000001
                theme: systeem
                locale: nl
                shareLocation: true
                shareTimetable: true
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [account]
      operationId: updateMe
      summary: Wijzig je weergavenaam of instellingen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Bijgewerkt profiel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                id: 7d1c2c5e-6f4b-4c39-9c1e-0a5b8f0b1a11
                email: anna@example.org
                displayName: Anna
                role: bezoeker
                theme: donker
                locale: en
                shareLocation: false
                shareTimetable: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [account]
      operationId: deleteMe
      summary: Verwijder je account en al je gegevens
      responses:
        '204': { description: Account verwijderd }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/location:
    put:
      tags: [friends]
      operationId: updateMyLocation
      summary: Deel je huidige locatie met je vrienden
      description: Wordt geweigerd als `shareLocation` uit staat. De locatie verloopt na 10 minuten.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
      responses:
        '204': { description: Locatie opgeslagen }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [friends]
      operationId: deleteMyLocation
      summary: Stop direct met delen en wis je locatie
      responses:
        '204': { description: Locatie gewist }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- friends
  /friend-codes:
    post:
      tags: [friends]
      operationId: createFriendCode
      summary: Maak een tijdelijke vriendcode (en QR-code)
      description: De code is 10 minuten geldig en kan één keer gebruikt worden. Een nieuwe code maakt de vorige ongeldig.
      responses:
        '201':
          description: Nieuwe code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendCode' }
              example:
                code: K7QM-4XPA
                qrPayload: 'http://localhost:5173/?vriend=K7QM-4XPA'
                expiresAt: '2026-06-20T14:10:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /friends:
    get:
      tags: [friends]
      operationId: listFriends
      summary: Lijst van je vrienden
      responses:
        '200':
          description: Vrienden
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/Friend' }
              example:
                - id: 2b9a8f1e-3c55-4c2a-9e77-1d0f4b6a2c22
                  displayName: Bram
                  since: '2026-06-19T18:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [friends]
      operationId: addFriend
      summary: Voeg een vriend toe met zijn of haar code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemFriendCode' }
      responses:
        '201':
          description: Vriend toegevoegd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Friend' }
              example:
                id: 2b9a8f1e-3c55-4c2a-9e77-1d0f4b6a2c22
                displayName: Bram
                since: '2026-06-20T14:02:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Code onbekend, verlopen of al gebruikt (altijd dezelfde melding)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /friends/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [friends]
      operationId: removeFriend
      summary: Verwijder een vriend
      description: Vanaf dat moment ziet geen van beiden nog de locatie, pins of timetable van de ander.
      responses:
        '204': { description: Vriend verwijderd }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /friends/locations:
    get:
      tags: [friends]
      operationId: listFriendLocations
      summary: Laatste locaties van vrienden die delen
      description: Alleen vrienden met `shareLocation` aan en een niet-verlopen locatie.
      responses:
        '200':
          description: Locaties
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/FriendLocation' }
              example:
                - userId: 2b9a8f1e-3c55-4c2a-9e77-1d0f4b6a2c22
                  displayName: Bram
                  latitude: 52.3731
                  longitude: 4.8922
                  accuracyM: 12
                  recordedAt: '2026-06-20T14:01:30Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /friends/{userId}/timetable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [timetable]
      operationId: getFriendTimetable
      summary: Timetable van een vriend
      description: Alleen als jullie vrienden zijn én de vriend `shareTimetable` aan heeft; anders 404.
      responses:
        '200':
          description: Optredens die de vriend heeft opgeslagen
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/Performance' }
              example:
                - id: 9f0e5c1a-7b2d-4e8f-a1c3-5d6e7f8a9b01
                  stageId: 4a1b2c3d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  artist: De Jeugd van Tegenwoordig
                  startsAt: '2026-06-20T21:00:00Z'
                  endsAt: '2026-06-20T22:15:00Z'
                  status: gepland
                  signupCapacity: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- map
  /pins:
    get:
      tags: [map]
      operationId: listPins
      summary: Je eigen pins en de gedeelde pins van vrienden
      responses:
        '200':
          description: Pins
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: { $ref: '#/components/schemas/Pin' }
              example:
                - id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                  userId: 7d1c2c5e-6f4b-4c39-9c1e-0a5b8f0b1a11
                  label: Onze tent
                  latitude: 52.3702
                  longitude: 4.8951
                  visibility: vrienden
                  createdAt: '2026-06-19T16:00:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [map]
      operationId: createPin
      summary: Zet een pin op de kaart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePin' }
      responses:
        '201':
          description: Pin aangemaakt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pin' }
              example:
                id: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                userId: 7d1c2c5e-6f4b-4c39-9c1e-0a5b8f0b1a11
                label: Onze tent
                latitude: 52.3702
                longitude: 4.8951
                visibility: vrienden
                createdAt: '2026-06-19T16:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /pins/{pinId}:
    parameters:
      - name: pinId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [map]
      operationId: deletePin
      summary: Verwijder een eigen pin
      responses:
        '204': { description: Pin verwijderd }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- chat
  /messages/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [chat]
      operationId: listMessages
      summary: Berichten in je gesprek met een vriend
      parameters:
        - name: before
          in: query
          description: Alleen berichten van vóór dit tijdstip (voor paginering)
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Berichten, nieuwste eerst
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/Message' }
              example:
                - id: 5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9
                  senderId: 2b9a8f1e-3c55-4c2a-9e77-1d0f4b6a2c22
                  recipientId: 7d1c2c5e-6f4b-4c39-9c1e-0a5b8f0b1a11
                  body: Zie je bij het hoofdpodium!
                  createdAt: '2026-06-20T20:45:00Z'
                  readAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [chat]
      operationId: sendMessage
      summary: Stuur een bericht naar een vriend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessage' }
      responses:
        '201':
          description: Bericht verstuurd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example:
                id: 6f7a8b9c-0d1e-4f2a-b3c4-d5e6f7a8b9c0
                senderId: 7d1c2c5e-6f4b-4c39-9c1e-0a5b8f0b1a11
                recipientId: 2b9a8f1e-3c55-4c2a-9e77-1d0f4b6a2c22
                body: Ben er over 5 min
                createdAt: '2026-06-20T20:46:00Z'
                readAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- timetable
  /stages:
    get:
      tags: [timetable]
      operationId: listStages
      summary: Alle podia
      responses:
        '200':
          description: Podia
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/Stage' }
              example:
                - id: 4a1b2c3d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  name: Hoofdpodium
                  latitude: 52.3725
                  longitude: 4.8930
                  capacity: 15000
                  sortOrder: 1
        '401': { $ref: '#/components/responses/Unauthorized' }

  /map-points:
    get:
      tags: [map]
      operationId: listMapPoints
      summary: Kaartpunten van de organisatie (wifi, EHBO, water, ingang …)
      description: De app bewaart deze lijst op de telefoon, zodat de punten ook zonder internet zichtbaar blijven.
      responses:
        '200':
          description: Kaartpunten
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/MapPoint' }
              example:
                - id: 7c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
                  kind: wifi
                  name: Wifi bij de ingang
                  description: Gratis wifi, netwerk "Festival"
                  latitude: 52.3731
                  longitude: 4.8921
        '401': { $ref: '#/components/responses/Unauthorized' }

  /performances:
    get:
      tags: [timetable]
      operationId: listPerformances
      summary: De volledige timetable
      parameters:
        - name: stageId
          in: query
          schema: { type: string, format: uuid }
        - name: day
          in: query
          description: Datum (YYYY-MM-DD) in de tijdzone van het festival
          schema: { type: string, format: date }
      responses:
        '200':
          description: Optredens, gesorteerd op begintijd
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items: { $ref: '#/components/schemas/Performance' }
              example:
                - id: 9f0e5c1a-7b2d-4e8f-a1c3-5d6e7f8a9b01
                  stageId: 4a1b2c3d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  artist: De Jeugd van Tegenwoordig
                  startsAt: '2026-06-20T21:00:00Z'
                  endsAt: '2026-06-20T22:15:00Z'
                  status: gepland
                  signupCapacity: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/timetable:
    get:
      tags: [timetable]
      operationId: getMyTimetable
      summary: Je persoonlijke timetable
      responses:
        '200':
          description: Opgeslagen optredens
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/Performance' }
              example: []
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/timetable/{performanceId}:
    parameters:
      - $ref: '#/components/parameters/PerformanceId'
    put:
      tags: [timetable]
      operationId: addToMyTimetable
      summary: Zet een optreden in je timetable
      responses:
        '204': { description: Toegevoegd (of stond er al in) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [timetable]
      operationId: removeFromMyTimetable
      summary: Haal een optreden uit je timetable
      responses:
        '204': { description: Verwijderd }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/signups:
    get:
      tags: [timetable]
      operationId: listMySignups
      summary: Shows waarvoor je bent aangemeld
      responses:
        '200':
          description: Aanmeldingen
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/Signup' }
              example:
                - performanceId: 9f0e5c1a-7b2d-4e8f-a1c3-5d6e7f8a9b01
                  createdAt: '2026-06-20T15:00:00Z'
                  checkedInAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /performances/{performanceId}/signup:
    parameters:
      - $ref: '#/components/parameters/PerformanceId'
    post:
      tags: [timetable]
      operationId: signUpForShow
      summary: Meld je aan voor een show met beperkte plekken
      responses:
        '201':
          description: Aangemeld
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Signup' }
              example:
                performanceId: 9f0e5c1a-7b2d-4e8f-a1c3-5d6e7f8a9b01
                createdAt: '2026-06-20T15:00:00Z'
                checkedInAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Vol, of je bent al aangemeld
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [timetable]
      operationId: cancelSignup
      summary: Meld je af voor een show
      responses:
        '204': { description: Afgemeld }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- crowd
  /crowd:
    get:
      tags: [crowd]
      operationId: getCrowdLevels
      summary: Huidige drukte per podium
      responses:
        '200':
          description: Laatste meting per podium
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/CrowdLevel' }
              example:
                - stageId: 4a1b2c3d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  level: druk
                  headCount: 11200
                  measuredAt: '2026-06-20T21:10:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- notifications
  /push-subscriptions/public-key:
    get:
      tags: [notifications]
      operationId: getPushPublicKey
      summary: VAPID-sleutel om je voor pushmeldingen aan te melden
      responses:
        '200':
          description: Publieke sleutel, of null als push uit staat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [publicKey]
                properties:
                  publicKey: { type: [string, 'null'] }
              example: { publicKey: null }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push-subscriptions:
    post:
      tags: [notifications]
      operationId: subscribePush
      summary: Registreer dit apparaat voor pushmeldingen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscription' }
      responses:
        '201': { description: Geregistreerd }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [notifications]
      operationId: unsubscribePush
      summary: Zet pushmeldingen voor dit apparaat uit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri, pattern: '^https://', maxLength: 1000 }
      responses:
        '204': { description: Uitgeschreven }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /announcements:
    get:
      tags: [notifications]
      operationId: listAnnouncements
      summary: Actuele mededelingen en noodberichten
      responses:
        '200':
          description: Mededelingen, nieuwste eerst
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/Announcement' }
              example:
                - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e
                  level: nood
                  titleNl: Onweer verwacht
                  titleEn: Thunderstorm expected
                  bodyNl: Ga naar een van de overdekte zones.
                  bodyEn: Please go to one of the covered areas.
                  createdAt: '2026-06-20T19:30:00Z'
                  expiresAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sos:
    post:
      tags: [notifications]
      operationId: sendSos
      summary: Druk op de SOS-knop
      description: Werkt ook als `shareLocation` uit staat — de locatie gaat dan alleen naar de organisatie. Bel bij levensgevaar altijd 112.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SosRequest' }
      responses:
        '201':
          description: Melding ontvangen door de organisatie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SosAlert' }
              example:
                id: 8b9c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
                userId: 7d1c2c5e-6f4b-4c39-9c1e-0a5b8f0b1a11
                latitude: 52.3710
                longitude: 4.8940
                message: Vriendin onwel bij de bar
                status: open
                createdAt: '2026-06-20T22:05:00Z'
                resolvedAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- chatbot
  /chatbot:
    post:
      tags: [chatbot]
      operationId: askChatbot
      summary: Stel een vraag aan de festivalassistent
      description: De assistent krijgt alleen openbare festivalinformatie mee (timetable, plattegrond, FAQ) — nooit locaties, chats of andere persoonsgegevens.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatbotRequest' }
      responses:
        '200':
          description: Antwoord
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatbotResponse' }
              example:
                answer: De Jeugd van Tegenwoordig speelt zaterdag om 23:00 op het Hoofdpodium.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- admin
  /admin/announcements:
    post:
      tags: [admin]
      operationId: createAnnouncement
      summary: Plaats een mededeling of noodbericht
      description: Niveau `nood` wordt direct via WebSocket én push naar alle bezoekers gestuurd. Wordt gelogd in `audit_log`.
      x-roles: [beheerder, organisatie]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAnnouncement' }
      responses:
        '201':
          description: Geplaatst
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Announcement' }
              example:
                id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e
                level: nood
                titleNl: Onweer verwacht
                titleEn: Thunderstorm expected
                bodyNl: Ga naar een van de overdekte zones.
                bodyEn: Please go to one of the covered areas.
                createdAt: '2026-06-20T19:30:00Z'
                expiresAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/map-points:
    post:
      tags: [admin]
      operationId: createMapPoint
      summary: Zet een punt op de kaart
      x-roles: [beheerder, organisatie]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMapPoint' }
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/map-points/{mapPointId}:
    parameters:
      - $ref: '#/components/parameters/MapPointId'
    patch:
      tags: [admin]
      operationId: updateMapPoint
      summary: Wijzig een kaartpunt
      x-roles: [beheerder, organisatie]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMapPoint' }
      responses:
        '200':
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      operationId: deleteMapPoint
      summary: Verwijder een kaartpunt
      x-roles: [beheerder, organisatie]
      responses:
        '204': { description: Verwijderd }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/performances:
    post:
      tags: [admin]
      operationId: createPerformance
      summary: Voeg een optreden toe aan de timetable
      x-roles: [beheerder, organisatie]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePerformance' }
      responses:
        '201':
          description: Toegevoegd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Performance' }
              example:
                id: 9f0e5c1a-7b2d-4e8f-a1c3-5d6e7f8a9b01
                stageId: 4a1b2c3d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                artist: De Jeugd van Tegenwoordig
                startsAt: '2026-06-20T21:00:00Z'
                endsAt: '2026-06-20T22:15:00Z'
                status: gepland
                signupCapacity: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/performances/{performanceId}:
    parameters:
      - $ref: '#/components/parameters/PerformanceId'
    patch:
      tags: [admin]
      operationId: updatePerformance
      summary: Wijzig een optreden (tijd, status)
      description: Bezoekers die dit optreden in hun timetable hebben, krijgen een live update en een pushmelding.
      x-roles: [beheerder, organisatie]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePerformance' }
      responses:
        '200':
          description: Bijgewerkt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Performance' }
              example:
                id: 9f0e5c1a-7b2d-4e8f-a1c3-5d6e7f8a9b01
                stageId: 4a1b2c3d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                artist: De Jeugd van Tegenwoordig
                startsAt: '2026-06-20T21:30:00Z'
                endsAt: '2026-06-20T22:45:00Z'
                status: vertraagd
                signupCapacity: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/sos:
    get:
      tags: [admin]
      operationId: listSosAlerts
      summary: Openstaande SOS-meldingen
      x-roles: [beheerder, organisatie, ehbo, beveiliging]
      responses:
        '200':
          description: Meldingen, oudste eerst
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/SosAlert' }
              example:
                - id: 8b9c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
                  userId: 7d1c2c5e-6f4b-4c39-9c1e-0a5b8f0b1a11
                  latitude: 52.3710
                  longitude: 4.8940
                  message: Vriendin onwel bij de bar
                  status: open
                  createdAt: '2026-06-20T22:05:00Z'
                  resolvedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/sos/{sosId}:
    parameters:
      - name: sosId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      operationId: updateSosAlert
      summary: Werk de status van een SOS-melding bij
      x-roles: [beheerder, organisatie, ehbo, beveiliging]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/SosStatus' }
      responses:
        '200':
          description: Bijgewerkt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SosAlert' }
              example:
                id: 8b9c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
                userId: 7d1c2c5e-6f4b-4c39-9c1e-0a5b8f0b1a11
                latitude: 52.3710
                longitude: 4.8940
                message: Vriendin onwel bij de bar
                status: afgehandeld
                createdAt: '2026-06-20T22:05:00Z'
                resolvedAt: '2026-06-20T22:20:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Zoek bezoekers van dit festival (maximaal 100)
      x-roles: [beheerder, organisatie]
      parameters:
        - name: q
          in: query
          description: Zoekt in naam en e-mailadres
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Gebruikers, op naam
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [admin]
      operationId: updateUser
      summary: Wijzig het tickettype of blokkeer een bezoeker
      description: |
        Alleen bezoekers met een ticket van dit festival. Een blokkade geldt standaard alleen voor
        dit festival (`blockScope: festival`). Alleen een eigenaar of sudo kan iemand voor alle
        festivals blokkeren (`blockScope: alle`); dat account wordt direct uitgelogd en kan niet meer inloggen.
      x-roles: [beheerder, organisatie]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUser' }
      responses:
        '200':
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/tickets/import:
    post:
      tags: [admin]
      operationId: importTickets
      summary: Importeer ticketcodes van de ticketverkoper
      description: Codes worden direct gehasht; de platte codes worden niet opgeslagen.
      x-roles: [beheerder]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketImport' }
      responses:
        '200':
          description: Resultaat van de import
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [imported, skipped]
                properties:
                  imported: { type: integer, minimum: 0 }
                  skipped: { type: integer, minimum: 0 }
              example: { imported: 2, skipped: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- festivals
  /festivals:
    get:
      tags: [festivals]
      operationId: listMyFestivals
      summary: Festivals waar je bij mag
      description: |
        Bezoekers zien de festivals waar ze een ticket voor hebben en die nog niet zijn afgelopen.
        Personeel ziet de festivals waar het een rol heeft; eigenaren en sudo zien alles.
        Het eerste festival in de lijst is het festival dat de server kiest als je geen `X-Festival-Id` meestuurt.
      responses:
        '200':
          description: Festivals, het meest logische eerst
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/Festival' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/tickets:
    post:
      tags: [festivals]
      operationId: addMyTicket
      summary: Voeg een ticket toe aan je account
      description: Het ticket bepaalt bij welk festival je erbij komt. Hoogstens één ticket per festival.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddTicket' }
      responses:
        '201':
          description: Toegevoegd; je festivals
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/Festival' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Ticket onbekend, al gebruikt of verlopen, of je hebt al een ticket voor dit festival
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/festivals:
    post:
      tags: [festivals]
      operationId: createFestival
      summary: Maak een festival aan
      x-platform-roles: [eigenaar, sudo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFestival' }
      responses:
        '201':
          description: Aangemaakt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Festival' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/festival:
    patch:
      tags: [festivals]
      operationId: updateFestival
      summary: Wijzig de naam of de datums van dit festival
      x-roles: [beheerder]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFestival' }
      responses:
        '200':
          description: Gewijzigd
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Festival' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/team:
    get:
      tags: [festivals]
      operationId: listTeam
      summary: Het personeel van dit festival
      x-roles: [beheerder, organisatie]
      responses:
        '200':
          description: Teamleden
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/TeamMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [festivals]
      operationId: setTeamMember
      summary: Geef iemand een rol bij dit festival
      description: |
        Wie welke rol mag uitdelen: `beheerder` alleen sudo; `organisatie` een beheerder (of eigenaar);
        `ehbo` en `beveiliging` ook de organisatie. Bestaat er nog geen account met dit e-mailadres,
        dan wordt het aangemaakt met de opgegeven naam en het tijdelijke wachtwoord.
      x-roles: [beheerder, organisatie]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTeamMember' }
      responses:
        '200':
          description: Opgeslagen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/team/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [festivals]
      operationId: removeTeamMember
      summary: Haal iemand uit het team van dit festival
      x-roles: [beheerder, organisatie]
      responses:
        '204': { description: Verwijderd uit het team (het account blijft bestaan) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/owners:
    get:
      tags: [festivals]
      operationId: listOwners
      summary: Eigenaren van het platform
      x-platform-roles: [sudo]
      responses:
        '200':
          description: Eigenaren en sudo
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items: { $ref: '#/components/schemas/Owner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [festivals]
      operationId: addOwner
      summary: Maak een bestaand account eigenaar
      x-platform-roles: [sudo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddOwner' }
      responses:
        '200':
          description: Opgeslagen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Owner' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/owners/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [festivals]
      operationId: removeOwner
      summary: Haal de rol eigenaar weg
      x-platform-roles: [sudo]
      responses:
        '204': { description: Geen eigenaar meer (het account blijft bestaan) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- iot
  /iot/crowd-readings:
    post:
      tags: [iot]
      operationId: postCrowdReading
      summary: Sensor stuurt een drukte-meting
      security:
        - iotKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrowdReadingInput' }
      responses:
        '202': { description: Meting ontvangen }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-token uit /auth/login, 15 minuten geldig.
    iotKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Eigen sleutel per sensor, alleen als hash opgeslagen.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PerformanceId:
      name: performanceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MapPointId:
      name: mapPointId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Ongeldige invoer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: validation_failed, message: 'Het veld "body" is te lang.' }
    Unauthorized:
      description: Niet (meer) ingelogd
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unauthorized, message: Log opnieuw in. }
    Forbidden:
      description: Geen toestemming
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: forbidden, message: Je hebt geen toegang tot deze functie. }
    NotFound:
      description: Bestaat niet of je hebt er geen toegang toe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not_found, message: Niet gevonden. }
    TooManyRequests:
      description: Te veel verzoeken; probeer het later opnieuw
      headers:
        Retry-After:
          description: Aantal seconden wachten
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: rate_limited, message: Te veel pogingen. Probeer het over een minuut opnieuw. }
    ServiceUnavailable:
      description: De API is tijdelijk niet beschikbaar
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          description: Vaste code voor de app
          enum: [validation_failed, unauthorized, forbidden, not_found, conflict, rate_limited, internal]
        message:
          type: string
          maxLength: 300
          description: Leesbare uitleg voor de gebruiker, zonder technische details

    # --- auth
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [ticketCode, email, password, displayName]
      properties:
        ticketCode: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Minimaal 12 tekens; wordt gecontroleerd tegen bekende gelekte wachtwoorden.
        displayName: { type: string, minLength: 1, maxLength: 40 }
        locale: { $ref: '#/components/schemas/Locale' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 16, maxLength: 512 }
    AuthTokens:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Seconden tot het access-token verloopt, maximum: 900 }

    # --- account
    Role:
      type: string
      enum: [bezoeker, beheerder, organisatie, ehbo, beveiliging]
      description: Rol in het festival van dit verzoek. Wie alleen een ticket heeft is bezoeker.
    FestivalRole: { type: string, enum: [beheerder, organisatie, ehbo, beveiliging] }
    PlatformRole: { type: string, enum: [eigenaar, sudo] }
    Theme: { type: string, enum: [systeem, licht, donker] }
    Locale: { type: string, enum: [nl, en] }
    Me:
      type: object
      x-table: users
      additionalProperties: false
      x-computed: [role, festivalId]
      required: [id, email, displayName, role, platformRole, festivalId, theme, locale, shareLocation, shareTimetable]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        platformRole:
          oneOf: [{ $ref: '#/components/schemas/PlatformRole' }, { type: 'null' }]
        festivalId:
          type: [string, 'null']
          format: uuid
          description: Het festival van dit verzoek; null als je (nog) bij geen festival hoort
        theme: { $ref: '#/components/schemas/Theme' }
        locale: { $ref: '#/components/schemas/Locale' }
        shareLocation: { type: boolean }
        shareTimetable: { type: boolean }
    UpdateMeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 40 }
        theme: { $ref: '#/components/schemas/Theme' }
        locale: { $ref: '#/components/schemas/Locale' }
        shareLocation: { type: boolean }
        shareTimetable: { type: boolean }

    # --- friends
    FriendCode:
      type: object
      additionalProperties: false
      required: [code, qrPayload, expiresAt]
      properties:
        code: { type: string, pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}$' }
        qrPayload: { type: string }
        expiresAt: { type: string, format: date-time }
    RedeemFriendCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9]{4}-?[A-Za-z0-9]{4}$' }
    Friend:
      type: object
      additionalProperties: false
      required: [id, displayName, since]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        since: { type: string, format: date-time }
    LocationUpdate:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0, maximum: 10000 }
    FriendLocation:
      type: object
      x-table: locations
      x-computed: [displayName]
      additionalProperties: false
      required: [userId, displayName, latitude, longitude, recordedAt]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        accuracyM: { type: [number, 'null'] }
        recordedAt: { type: string, format: date-time }

    # --- map
    PinVisibility: { type: string, enum: [prive, vrienden] }
    Pin:
      type: object
      x-table: pins
      additionalProperties: false
      required: [id, userId, label, latitude, longitude, visibility, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        label: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        visibility: { $ref: '#/components/schemas/PinVisibility' }
        createdAt: { type: string, format: date-time }
    CreatePin:
      type: object
      additionalProperties: false
      required: [label, latitude, longitude]
      properties:
        label: { type: string, minLength: 1, maxLength: 60 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        visibility: { $ref: '#/components/schemas/PinVisibility' }

    # --- chat
    Message:
      type: object
      x-table: messages
      additionalProperties: false
      required: [id, senderId, recipientId, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        recipientId: { type: string, format: uuid }
        body: { type: string, description: Platte tekst; de app toont dit nooit als HTML. }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    SendMessage:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }

    # --- timetable
    Stage:
      type: object
      x-table: stages
      additionalProperties: false
      required: [id, name, latitude, longitude, capacity, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        capacity: { type: integer }
        sortOrder: { type: integer }
    TicketType: { type: string, enum: [weekend, dag, vip] }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, ticketType, blocked, blockScope, blockedReason, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        ticketType: { type: [string, 'null'] }
        blocked: { type: boolean }
        blockScope:
          type: [string, 'null']
          enum: [festival, alle, null]
          description: festival = alleen dit festival, alle = alle festivals
        blockedReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    UpdateUser:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ticketType: { $ref: '#/components/schemas/TicketType' }
        blocked: { type: boolean }
        blockedReason: { type: string, minLength: 1, maxLength: 200 }
        blockScope:
          type: string
          enum: [festival, alle]
          description: Standaard festival. "alle" mag alleen een eigenaar of sudo.
    Festival:
      type: object
      x-table: festivals
      x-computed: [role, active]
      additionalProperties: false
      required: [id, name, startsAt, endsAt, role, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean, description: Het festival is nu bezig }
    CreateFestival:
      type: object
      additionalProperties: false
      required: [name, startsAt, endsAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    UpdateFestival:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    AddTicket:
      type: object
      additionalProperties: false
      required: [ticketCode]
      properties:
        ticketCode: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
    TeamMember:
      type: object
      x-table: festival_members
      additionalProperties: false
      required: [userId, email, displayName, role, addedAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/FestivalRole' }
        addedAt: { type: string, format: date-time }
    SetTeamMember:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/FestivalRole' }
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Alleen nodig als er nog geen account met dit e-mailadres is
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Tijdelijk wachtwoord; alleen nodig als er nog geen account is
    Owner:
      type: object
      additionalProperties: false
      required: [userId, email, displayName, platformRole]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        platformRole: { $ref: '#/components/schemas/PlatformRole' }
    AddOwner:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    MapPointKind: { type: string, enum: [wifi, ehbo, water, toilet, ingang, uitgang, eten, activiteit, oplaadpunt, info] }
    MapPoint:
      type: object
      x-table: map_points
      additionalProperties: false
      required: [id, kind, name, description, latitude, longitude]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MapPointKind' }
        name: { type: string }
        description: { type: [string, 'null'] }
        latitude: { type: number }
        longitude: { type: number }
    CreateMapPoint:
      type: object
      additionalProperties: false
      required: [kind, name, latitude, longitude]
      properties:
        kind: { $ref: '#/components/schemas/MapPointKind' }
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    UpdateMapPoint:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        kind: { $ref: '#/components/schemas/MapPointKind' }
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: [string, 'null'], maxLength: 200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    PerformanceStatus: { type: string, enum: [gepland, vertraagd, verplaatst, geannuleerd] }
    Performance:
      type: object
      x-table: performances
      additionalProperties: false
      required: [id, stageId, artist, startsAt, endsAt, status]
      properties:
        id: { type: string, format: uuid }
        stageId: { type: string, format: uuid }
        artist: { type: string }
        description: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/PerformanceStatus' }
        signupCapacity: { type: [integer, 'null'] }
    CreatePerformance:
      type: object
      additionalProperties: false
      required: [stageId, artist, startsAt, endsAt]
      properties:
        stageId: { type: string, format: uuid }
        artist: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        signupCapacity: { type: integer, minimum: 1 }
    UpdatePerformance:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        stageId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/PerformanceStatus' }
        description: { type: string, maxLength: 2000 }
    Signup:
      type: object
      x-table: show_signups
      additionalProperties: false
      required: [performanceId, createdAt]
      properties:
        performanceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        checkedInAt: { type: [string, 'null'], format: date-time }

    # --- crowd
    CrowdLevelValue: { type: string, enum: [rustig, gemiddeld, druk, vol] }
    CrowdLevel:
      type: object
      x-table: crowd_readings
      additionalProperties: false
      required: [stageId, level, measuredAt]
      properties:
        stageId: { type: string, format: uuid }
        level: { $ref: '#/components/schemas/CrowdLevelValue' }
        headCount: { type: integer, minimum: 0 }
        measuredAt: { type: string, format: date-time }
    CrowdReadingInput:
      type: object
      additionalProperties: false
      required: [stageId, headCount]
      properties:
        stageId: { type: string, format: uuid }
        headCount: { type: integer, minimum: 0, maximum: 200000 }
        measuredAt: { type: string, format: date-time }

    # --- notifications
    PushSubscription:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, pattern: '^https://', maxLength: 1000 }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, maxLength: 200 }
            auth: { type: string, maxLength: 100 }
    AnnouncementLevel: { type: string, enum: [info, waarschuwing, nood] }
    Announcement:
      type: object
      x-table: announcements
      additionalProperties: false
      required: [id, level, titleNl, titleEn, bodyNl, bodyEn, createdAt]
      properties:
        id: { type: string, format: uuid }
        level: { $ref: '#/components/schemas/AnnouncementLevel' }
        titleNl: { type: string }
        titleEn: { type: string }
        bodyNl: { type: string }
        bodyEn: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
    CreateAnnouncement:
      type: object
      additionalProperties: false
      required: [level, titleNl, titleEn, bodyNl, bodyEn]
      properties:
        level: { $ref: '#/components/schemas/AnnouncementLevel' }
        titleNl: { type: string, minLength: 1, maxLength: 120 }
        titleEn: { type: string, minLength: 1, maxLength: 120 }
        bodyNl: { type: string, minLength: 1, maxLength: 2000 }
        bodyEn: { type: string, minLength: 1, maxLength: 2000 }
        expiresAt: { type: string, format: date-time }
    SosStatus: { type: string, enum: [open, in_behandeling, afgehandeld] }
    SosRequest:
      type: object
      additionalProperties: false
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        message: { type: string, maxLength: 500 }
      dependentRequired:
        latitude: [longitude]
        longitude: [latitude]
    SosAlert:
      type: object
      x-table: sos_alerts
      additionalProperties: false
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: [string, 'null'], format: uuid }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        message: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/SosStatus' }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }

    # --- chatbot
    ChatbotRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }
        locale: { $ref: '#/components/schemas/Locale' }
    ChatbotResponse:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer: { type: string }

    # --- admin
    TicketImport:
      type: object
      additionalProperties: false
      required: [tickets]
      properties:
        tickets:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [code, validFrom, validUntil]
            properties:
              code: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9-]+$' }
              ticketType: { type: string, maxLength: 40 }
              validFrom: { type: string, format: date-time }
              validUntil: { type: string, format: date-time }
